#This file is modified at runtime by bootmenu.nsh
#
# Modern (24.04 "Noble" and newer) install-phase boot menu.
#
# Unlike the legacy lupin path this does NOT use ubiquity: there is no
# "automatic-ubiquity" and no debconf driven partitioning. Instead casper is
# booted into a plain live session and the casper preseed mechanism
# is used to drop our self-contained installer into the live system, which then
# populates the loopback root.disk itself. See data/custom-installation-modern/.
#
# Trigger: wubi appends a tiny cpio to the casper initrd that OVERRIDES
# casper-bottom/24preseed with its own staging hook (data/custom-installation-
# modern/casper-hook/24preseed). preseed/early_command is NOT used because the
# 24.04 desktop debconf db ships no debian-installer/preseed templates. The hook
# reads "wubi-custom-dir=" from the kernel cmdline to find the payload that
# iso-scan mounted (with the host partition) at /isodevice.

set default=0
echo "$(title1)"
echo "$(title2)"
if sleep --verbose --interruptible 5 ; then
   set timeout=0
fi
echo

search -s -f -n $(kernel)

menuentry "$(normal_mode_title)" {
    linux $(kernel) wubi-custom-dir=$(custom_installation_dir) iso-scan/filename=$(iso_path) boot=casper noprompt quiet splash ro debian-installer/locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(accessibility) $(rootflags)
    initrd $(initrd)
}

menuentry "$(safe_graphic_mode_title)" {
    linux $(kernel) wubi-custom-dir=$(custom_installation_dir) iso-scan/filename=$(iso_path) boot=casper noprompt nomodeset ro debian-installer/locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(accessibility) $(rootflags)
    initrd $(initrd)
}

menuentry "$(verbose_mode_title)" {
    linux $(kernel) wubi-custom-dir=$(custom_installation_dir) iso-scan/filename=$(iso_path) boot=casper noprompt debug ro debian-installer/locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(accessibility) $(rootflags)
    initrd $(initrd)
}
