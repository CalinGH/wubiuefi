#This file is modified at runtime by bootmenu.nsh
#
# Automated real-partition install alongside Windows (subiquity autoinstall).
#
# The live session is booted with:
#   autoinstall  — tells subiquity to run in unattended mode
#   ds=nocloud\;s=file://<path>/  — points cloud-init at the user-data/meta-data
#                            pair that Wubi staged in <target>/install/autoinstall/
#
# The semicolon in the ds= value is backslash-escaped so GRUB does not treat it
# as a command separator.  The trailing slash in the path is required by the
# nocloud datasource, and the file:// scheme makes cloud-init read it as a local
# seed directory (the Windows host partition is mounted at /isodevice by casper's
# iso-scan).
#
# The "alongside" storage layout in user-data tells subiquity to automatically
# resize the largest Windows (NTFS) partition and install Ubuntu in the freed
# space, handling partition creation, formatting and bootloader installation.

set default=0
echo "$(title1)"
echo "$(title2)"
if sleep --verbose --interruptible 5 ; then
   set timeout=0
fi
echo

search -s -f -n $(kernel)

menuentry "$(normal_mode_title)" {
    linux $(kernel) iso-scan/filename=$(iso_path) boot=casper autoinstall ds=nocloud\;s=file:///isodevice$(autoinstall_dir)/ quiet splash ro debian-installer/locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(accessibility) $(rootflags)
    initrd $(initrd)
}

menuentry "$(safe_graphic_mode_title)" {
    linux $(kernel) iso-scan/filename=$(iso_path) boot=casper autoinstall ds=nocloud\;s=file:///isodevice$(autoinstall_dir)/ nomodeset ro debian-installer/locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(accessibility) $(rootflags)
    initrd $(initrd)
}

menuentry "$(verbose_mode_title)" {
    linux $(kernel) iso-scan/filename=$(iso_path) boot=casper autoinstall ds=nocloud\;s=file:///isodevice$(autoinstall_dir)/ debug ro debian-installer/locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(accessibility) $(rootflags)
    initrd $(initrd)
}
